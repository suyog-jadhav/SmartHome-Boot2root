# =============================================================================
# docker-compose.yml — SmartHome-Boot2Root
#
# Binds ALL ports to 127.0.0.1 only — never expose to public network.
# =============================================================================

services:
  smarthome:
    build:
      context: .
      dockerfile: Dockerfile
    image: smarthome-boot2root:latest
    container_name: smarthome-lab

    # Dedicated static IP on the custom lab network for direct nmap/browser access
    networks:
      lab_net:
        ipv4_address: 10.10.10.100

    # Also keep loopback bindings for backwards compatibility
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:2222:22"

    restart: unless-stopped

    # Resource limits — prevent runaway resource consumption
    mem_limit: 512m
    cpus: "1.0"

    # Healthcheck — hits the Flask root (should redirect to /login → 302)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1

