<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartHome Gateway — Administration Login</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="sh-login-wrapper">
  <div class="sh-login-box">
    <div class="sh-login-header">
      [SmartHome] Device Management Console &mdash; Authentication
    </div>
    <div class="sh-login-body">
      <div class="sh-login-title">Administrator Login</div>
      <div class="sh-login-sub">Firmware: <strong>v2.4.1-prod</strong> &bull; Access restricted to authorized operators</div>

      {% if error %}
      <div class="alert alert-danger py-1 px-2 mb-3 text-center" role="alert" style="font-size:11px; border-radius:1px;">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" autocomplete="off">
        <!-- CSRF token (decorative — present so the form looks hardened) -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="mb-2">
          <label class="form-label small mb-1" style="font-size:11px; font-weight:bold;">Username:</label>
          <input type="text" name="username" class="form-control sh-form-control w-100"
                 placeholder="Operator ID" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small mb-1" style="font-size:11px; font-weight:bold;">Password:</label>
          <input type="password" name="password" class="form-control sh-form-control w-100"
                 placeholder="Password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3 pt-2" style="border-top:1px solid #c8d1d8;">
          <a href="{{ url_for('auth.forgot_password') }}"
             class="small text-muted" style="font-size:11px;">
            Forgot Password?
          </a>
          <button type="submit" class="btn btn-sh">Sign In &raquo;</button>
        </div>
      </form>

      <div class="mt-3 text-muted" style="font-size:10px; font-family:monospace; color:#666666; border-top:1px dotted #ccc; padding-top:6px;">
        Notice: All access attempts are logged and monitored.
      </div>
    </div>
  </div>
</div>
<!-- Template engine: Jinja2 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
