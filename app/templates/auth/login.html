<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartHome — Login</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="sh-login-wrapper">
  <div class="sh-login-box">
    <div class="sh-login-logo">⌂</div>
    <div class="sh-login-title">SmartHome Portal</div>
    <div class="sh-login-sub">Administrator Login &mdash; Authorised use only</div>

    {% if error %}
    <div class="alert alert-danger py-2 text-center" role="alert" style="font-size:.88rem;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" autocomplete="off">
      <!-- CSRF token (decorative — present so the form looks hardened) -->
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="mb-3">
        <label class="form-label text-muted small mb-1">Username</label>
        <input type="text" name="username" class="form-control sh-form-control"
               placeholder="Username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small mb-1">Password</label>
        <input type="password" name="password" class="form-control sh-form-control"
               placeholder="Password" required>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-sh">Sign In</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">
        <a href="{{ url_for('auth.forgot_password') }}"
           class="text-muted text-decoration-none" style="font-size:.8rem;">
          Forgot password?
        </a>
      </small>
    </div>
    <div class="text-center mt-2" style="font-size:.72rem; color:#4b5563;">
      Too many failed attempts will temporarily lock your account.
    </div>
  </div>
</div>
<!-- Template engine: Jinja2 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
